<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Panel de Evaluación - LITPA</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      background:#0a0a0a;
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; min-height:100dvh;
      font-family:'Georgia',serif; overflow:hidden;
      width:100%;
    }
    /* Siempre centrado, logo arriba */
    .splash {
      text-align:center; position:relative; z-index:10;
      padding:20px; width:100%; max-width:500px;
      display:flex; flex-direction:column; align-items:center;
    }
    .logo-wrap {
      width:clamp(160px, 40vmin, 280px);
      height:clamp(182px, 45vmin, 318px);
      margin:0 auto clamp(16px,3vmin,28px);
      position:relative;
      animation: floatGlow 4s ease-in-out 5s infinite;
    }
    @keyframes floatGlow {
      0%,100% { transform:translateY(0);     filter:drop-shadow(0 0 20px rgba(212,175,55,.55)); }
      50%      { transform:translateY(-8px);  filter:drop-shadow(0 0 40px rgba(212,175,55,.9)); }
    }
    .logo-img {
      width:100%; height:100%; object-fit:contain;
      position:absolute; top:0; left:0;
      filter:grayscale(1) contrast(3) invert(1) sepia(1) saturate(6) hue-rotate(2deg) brightness(0.9);
      mix-blend-mode:screen;
      opacity:0; animation:revealLogo 1.2s ease forwards 3.5s;
    }
    @keyframes revealLogo { to { opacity:1; } }
    .logo-draw { width:100%; height:100%; position:absolute; top:0; left:0; pointer-events:none; }
    .trace-path {
      fill:none; stroke:#d4af37; stroke-width:6;
      stroke-linecap:round; stroke-linejoin:round;
      filter:drop-shadow(0 0 6px rgba(212,175,55,.9));
      stroke-dasharray:30000; stroke-dashoffset:30000;
      animation:traceDraw 3.5s ease-in-out forwards 0.3s;
    }
    @keyframes traceDraw { to { stroke-dashoffset:0; } }

    h1 {
      font-size:clamp(1.2rem, 4vw, 2.2rem);
      color:#d4af37; letter-spacing:clamp(3px,1vw,7px);
      text-transform:uppercase; margin-bottom:6px;
      text-shadow:0 0 22px rgba(212,175,55,.6); font-weight:bold;
      opacity:0; animation:fadeUp 1s ease 4.5s forwards;
    }
    .subtitle {
      font-size:clamp(.6rem,.9vw,.75rem); color:#8b6914;
      letter-spacing:clamp(2px,.8vw,5px);
      text-transform:uppercase; margin-bottom:clamp(20px,4vmin,36px);
      opacity:0; animation:fadeUp 1s ease 5s forwards;
    }
    .divider {
      width:clamp(120px,40vw,200px); height:1px;
      background:linear-gradient(90deg,transparent,#d4af37,transparent);
      margin:0 auto clamp(14px,2.5vmin,22px);
      opacity:0; animation:fadeUp 1s ease 5.2s forwards;
    }
    .btn-group {
      display:flex; gap:clamp(10px,2vw,20px);
      justify-content:center; flex-wrap:wrap;
      opacity:0; animation:fadeUp 1s ease 5.4s forwards;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .btn {
      display:inline-block;
      padding:clamp(10px,1.5vmin,14px) clamp(20px,4vw,44px);
      border:2px solid #d4af37; background:transparent;
      color:#d4af37; font-family:'Georgia',serif;
      font-size:clamp(.7rem,.9vw,.85rem);
      letter-spacing:clamp(2px,.6vw,4px); text-transform:uppercase;
      cursor:pointer; text-decoration:none; transition:all .3s;
      position:relative; overflow:hidden; white-space:nowrap;
    }
    .btn::before {
      content:''; position:absolute; top:0; left:-100%;
      width:100%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(212,175,55,.15),transparent);
      transition:left .45s;
    }
    .btn:hover::before { left:100%; }
    .btn:hover {
      background:rgba(212,175,55,.1);
      box-shadow:0 0 28px rgba(212,175,55,.4);
      transform:translateY(-2px);
    }
    .btn-admin { border-color:#8b6914; color:#8b6914; }
    .btn-admin:hover { background:rgba(139,105,20,.1); box-shadow:0 0 28px rgba(139,105,20,.4); }

    .particles { position:fixed; inset:0; pointer-events:none; z-index:1; }
    .particle {
      position:absolute; border-radius:50%; opacity:0;
      background:#d4af37; animation:pf linear infinite;
    }
    @keyframes pf {
      0%   { opacity:0; transform:translateY(100vh) scale(0); }
      10%  { opacity:.5; } 90% { opacity:.2; }
      100% { opacity:0; transform:translateY(-10vh) scale(1.5); }
    }

    /* Tablet landscape: siempre centrado, nunca horizontal */
    @media (min-width:768px) and (orientation:landscape) {
      .splash { flex-direction:column; text-align:center; max-width:500px; }
      .btn-group { justify-content:center; }
      .divider { margin-left:auto; margin-right:auto; }
    }
  </style>
</head>
<body>
<div class="particles" id="pts"></div>
<div class="splash">
  <div class="logo-wrap">
    <img class="logo-img" src="Logo.jpeg" alt="Escudo LITPA"/>
    <svg class="logo-draw" viewBox="0 0 1178 1335" xmlns="http://www.w3.org/2000/svg">

    </svg>
  </div>
  <h1>Panel de Evaluación</h1>
  <p class="subtitle">LITPA · Sistema de Calificaciones</p>
  <div class="divider"></div>
  <div class="btn-group">
    <a href="evaluadores.html" class="btn">Evaluadores</a>
    <a href="admin.html" class="btn btn-admin">Administrador</a>
  </div>
</div>
<script>
  window.addEventListener('load', () => {
    const p = document.getElementById('tp1');
    if (p) { const l=p.getTotalLength(); p.style.strokeDasharray=l; p.style.strokeDashoffset=l; }
  });
  const c = document.getElementById('pts');
  for (let i=0;i<45;i++){
    const p=document.createElement('div'); p.className='particle';
    p.style.left=Math.random()*100+'vw';
    p.style.width=(Math.random()*3+1)+'px'; p.style.height=p.style.width;
    p.style.animationDuration=(Math.random()*14+9)+'s';
    p.style.animationDelay=(Math.random()*14)+'s';
    c.appendChild(p);
  }
</script>
</body>
</html>
