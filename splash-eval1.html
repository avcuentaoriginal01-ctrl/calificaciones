<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Bienvenido - Evaluador 1</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#0a0a0a;
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; min-height:100dvh;
      font-family:'Georgia',serif; overflow:hidden; width:100%;
    }
    .splash { text-align:center; position:relative; z-index:10; padding:20px; width:100%; }
    .text-svg { display:block; margin:0 auto 20px; overflow:visible; width:min(600px,92vw); height:auto; }
    .trace-text {
      fill:none; stroke:#d4af37; stroke-width:2;
      stroke-linecap:round; stroke-linejoin:round;
      filter:drop-shadow(0 0 6px rgba(212,175,55,1));
      stroke-dasharray:4000; stroke-dashoffset:4000;
      animation:traceText 2.8s ease-in-out forwards 0.3s;
    }
    .fill-text { fill:#d4af37; opacity:0; animation:fillIn .6s ease forwards 3.2s; }
    @keyframes traceText { to { stroke-dashoffset:0; } }
    @keyframes fillIn    { to { opacity:1; } }
    .deco-line {
      width:0; height:1px;
      background:linear-gradient(90deg,transparent,#d4af37,transparent);
      margin:0 auto 16px;
      animation:expandLine .8s ease forwards 3.6s;
    }
    @keyframes expandLine { to { width:min(320px,70vw); } }
    .eval-label {
      font-size:clamp(.65rem,.9vw,.8rem); color:#8b6914;
      letter-spacing:clamp(3px,1vw,6px); text-transform:uppercase;
      opacity:0; animation:fadeUp .7s ease forwards 3.8s;
    }
    .year {
      font-size:clamp(.55rem,.7vw,.65rem); color:#3a3a3a;
      letter-spacing:4px; margin-top:8px;
      opacity:0; animation:fadeUp .7s ease forwards 4s;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .particles { position:fixed; inset:0; pointer-events:none; z-index:1; }
    .particle {
      position:absolute; border-radius:50%; opacity:0;
      background:#d4af37; animation:pf linear infinite;
    }
    @keyframes pf {
      0%   { opacity:0; transform:translateY(100vh) scale(0); }
      10%  { opacity:.4; } 90% { opacity:.15; }
      100% { opacity:0; transform:translateY(-10vh) scale(1.5); }
    }
  </style>
</head>
<body>
<div class="particles" id="pts"></div>
<div class="splash">
  <svg class="text-svg" viewBox="0 0 600 80" xmlns="http://www.w3.org/2000/svg">
    <text class="trace-text" id="tt1" x="300" y="62" text-anchor="middle"
      font-family="Georgia, serif" font-size="58" font-weight="bold" letter-spacing="4">BIENVENIDO(A)</text>
    <text class="fill-text" x="300" y="62" text-anchor="middle"
      font-family="Georgia, serif" font-size="58" font-weight="bold" letter-spacing="4">BIENVENIDO(A)</text>
  </svg>
  <div class="deco-line"></div>
  <p class="eval-label">Evaluador 1 · LITPA</p>
  <p class="year">2026</p>
</div>
<script>
  window.addEventListener('load', () => {
    const el = document.getElementById('tt1');
    if (el && el.getTotalLength) {
      const l = el.getTotalLength();
      el.style.strokeDasharray = l;
      el.style.strokeDashoffset = l;
    }

    // Activar pantalla completa + orientación horizontal
    // Se hace aquí porque el navegador lo permite al cargar desde un clic del usuario
    const fsEl = document.documentElement;
    const fsReq = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen
                || fsEl.mozRequestFullScreen || fsEl.msRequestFullscreen;
    if (fsReq) {
      fsReq.call(fsEl).then(() => {
        // Orientación horizontal solo después de entrar en fullscreen
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      }).catch(() => {});
    }
  });

  setTimeout(() => { window.location.href = 'evaluadores.html?eval=1&skip=1'; }, 5000);
  const c = document.getElementById('pts');
  for (let i=0;i<35;i++){
    const p=document.createElement('div'); p.className='particle';
    p.style.left=Math.random()*100+'vw';
    p.style.width=(Math.random()*2.5+1)+'px'; p.style.height=p.style.width;
    p.style.animationDuration=(Math.random()*14+9)+'s';
    p.style.animationDelay=(Math.random()*12)+'s';
    c.appendChild(p);
  }
</script>
</body>
</html>
